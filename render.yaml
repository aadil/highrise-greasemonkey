services:
  - type: web
    name: highrise-greasemonkey
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCAN_INTERVAL_MINUTES
        value: "30"
      - key: PORT
        value: "3000"
      # Required: Anthropic API key for AI reel suggestions
      # - key: ANTHROPIC_API_KEY
      #   value: sk-ant-...
      # Optional: Gmail for email alerts
      # - key: GMAIL_USER
      #   value: your-email@gmail.com
      # - key: GMAIL_APP_PASSWORD
      #   value: your-app-password
      # - key: ALERT_RECIPIENT
      #   value: your-email@gmail.com
